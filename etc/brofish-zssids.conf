# systemd drop-in for brofish.service, installed by scripts/zssids-engine.sh
# when the pcap_zeek_fleet feature is on. brofish.service itself stays zeek's unit;
# this override makes the service run zssids instead. @ZSSIDS_OPTS@ is filled in
# by zssids-engine.sh (--no-suricata when suricata keeps the IDS role).
[Unit]
Description=BroFish (zssids)

[Service]
Type=simple
RemainAfterExit=false
User=root
ExecStartPre=
# optional per-box extras, e.g. ZSSIDS_OPTS="--fanout 2"
EnvironmentFile=-/home/pi/.firewalla/config/zssids.env
ExecStart=
# zssids-run mounts /bspool, runs the platform's before_bro hooks (which
# rebuild local.zeek from additional_options.bro, as bro-run does for zeek) and
# applies the sysctl profile, then execs zssids. It lives beside the asset, not
# in the git checkout, so a downgrade cannot leave this unit pointing at a
# missing file (scripts/zssids-engine.sh keeps the copy fresh).
# The same order bro-run gives zeek: preparation first (mount /bspool, the
# platform before_bro hooks, which rebuild local.zeek from
# additional_options.bro, and the sysctl profile), then the capture process,
# then after_bro. ExecStartPre completes before ExecStart is forked, which
# ExecStartPost alone would not guarantee under Type=simple.
ExecStartPre=/home/pi/.firewalla/run/assets/zssids-run --prepare
ExecStart=/home/pi/.firewalla/run/assets/zssids-run --zeekctl-compat --status-file /bspool/zssids.status --http 127.0.0.1:8927 @ZSSIDS_OPTS@ $ZSSIDS_OPTS
ExecStartPost=/home/pi/.firewalla/run/assets/zssids-run --after-bro
ExecStop=
Restart=always
RestartSec=10
TimeoutStartSec=60
TimeoutStopSec=15
Nice=5
