# systemd drop-in for suricata.service, installed by scripts/fleet-engine.sh
# when pcap_suricata_fleet and pcap_zeek_fleet are both on and the pcap_zeek
# role is enabled: one fleet process under brofish.service serves both roles,
# so this unit must never run. A start or restart succeeds and leaves the unit
# inactive, which is what SuricataControl expects.
#
# fleet keeps the two roles apart inside that process: the capture socket takes
# suricata's own bpf-filter and zeek's restrict_filters are applied per packet,
# so the IDS still sees every packet zeek would have dropped or sampled.
[Unit]
ConditionPathExists=/nonexistent/fleet-serves-both-roles
