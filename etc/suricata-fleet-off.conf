# systemd drop-in for suricata.service, installed by scripts/fleet-engine.sh
# when pcap_zeek_suricata and pcap_zeek_fleet are both on:
# the fleet running as brofish evaluates the suricata rules and writes
# eve.json, so the suricata unit must never run. A start or restart succeeds
# and leaves the unit inactive, which is what SuricataControl expects.
[Unit]
ConditionPathExists=/nonexistent/fleet-does-ids
