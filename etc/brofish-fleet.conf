# systemd drop-in for brofish.service, installed by scripts/fleet-engine.sh
# when FW_FLOW_ENGINE_ZEEK is fleet. brofish.service itself stays zeek's unit;
# this override makes the service run fleet instead. @FLEET_OPTS@ is filled in
# by fleet-engine.sh (--no-suricata when suricata keeps the IDS role).
[Unit]
Description=BroFish (fleet)

[Service]
Type=simple
User=root
ExecStartPre=
# bro-run normally mounts this; fleet writes its live logs there
ExecStartPre=/bin/bash -c "mountpoint -q /bspool || { mkdir -p /bspool && mount -t tmpfs -o size=30m tmpfs /bspool; }"
# optional per-box extras, e.g. FLEET_OPTS="--fanout 2"
EnvironmentFile=-/home/pi/.firewalla/config/fleet.env
ExecStart=
ExecStart=/home/pi/.firewalla/run/assets/fleet --zeekctl-compat --status-file /bspool/fleet.status --http 127.0.0.1:8927 @FLEET_OPTS@ $FLEET_OPTS
ExecStop=
Restart=always
RestartSec=10
TimeoutStartSec=60
TimeoutStopSec=15
Nice=5
