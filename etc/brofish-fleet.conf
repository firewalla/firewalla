# systemd drop-in for brofish.service, installed by scripts/fleet-engine.sh
# when the pcap_zeek_fleet feature is on. brofish.service itself stays zeek's unit;
# this override makes the service run fleet instead. @FLEET_OPTS@ is filled in
# by fleet-engine.sh (--no-suricata when suricata keeps the IDS role).
[Unit]
Description=BroFish (fleet)

[Service]
Type=simple
RemainAfterExit=false
User=root
ExecStartPre=
# optional per-box extras, e.g. FLEET_OPTS="--fanout 2"
EnvironmentFile=-/home/pi/.firewalla/config/fleet.env
ExecStart=
# scripts/fleet-run mounts /bspool, runs the platform's before_bro hooks
# (which rebuild local.zeek from additional_options.bro, as bro-run does for
# zeek) and applies the sysctl profile, then execs fleet
ExecStart=/home/pi/firewalla/scripts/fleet-run --zeekctl-compat --status-file /bspool/fleet.status --http 127.0.0.1:8927 @FLEET_OPTS@ $FLEET_OPTS
ExecStartPost=/home/pi/firewalla/scripts/fleet-run --after-bro
ExecStop=
Restart=always
RestartSec=10
TimeoutStartSec=60
TimeoutStopSec=15
Nice=5
