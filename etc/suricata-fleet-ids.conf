# systemd drop-in for suricata.service, installed by scripts/fleet-engine.sh
# when pcap_zeek_suricata is on but pcap_zeek_fleet is off: the
# suricata unit runs fleet in IDS-only mode (rules and eve.json, no zeek logs,
# no spool) beside zeek. ExecReload is cleared because fleet reloads the rule
# files by mtime on its own.
[Unit]
Description=Suricata (fleet ids-only)

[Service]
Type=simple
# the platform units set RemainAfterExit=true; a long-running fleet must not
# be left "active (exited)" instead of being restarted
RemainAfterExit=false
User=root
EnvironmentFile=-/home/pi/.firewalla/config/fleet.env
ExecStart=
ExecStart=/home/pi/.firewalla/run/assets/fleet --zeekctl-compat --ids-only --status-file /bspool/fleet-ids.status --http 127.0.0.1:8928 $FLEET_IDS_OPTS
ExecReload=
ExecStop=
Restart=always
RestartSec=10
TimeoutStartSec=60
TimeoutStopSec=15
Nice=5
