# systemd drop-in for suricata.service, installed by scripts/zssids-engine.sh
# when pcap_suricata_fleet is on: the unit runs zssids in IDS-only mode (rules
# and eve.json, no zeek logs, no spool), with suricata's own interface list and
# capture filter, so zeek's restrict_filters cannot cost IDS coverage. This is
# used whether the flow role is zeek or zssids. ExecReload is cleared because
# zssids reloads the rule files by mtime on its own.
[Unit]
Description=Suricata (zssids ids-only)

[Service]
Type=simple
# the platform units set RemainAfterExit=true; a long-running zssids must not
# be left "active (exited)" instead of being restarted
RemainAfterExit=false
User=root
EnvironmentFile=-/home/pi/.firewalla/config/zssids.env
ExecStart=
ExecStart=/home/pi/.firewalla/run/assets/zssids-ids-run --status-file /bspool/zssids-ids.status --http 127.0.0.1:8928 $ZSSIDS_IDS_OPTS
ExecReload=
ExecStop=
Restart=always
RestartSec=10
TimeoutStartSec=60
TimeoutStopSec=15
Nice=5
