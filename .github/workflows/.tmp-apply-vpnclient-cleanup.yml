name: Apply temporary VPN cleanup patch

on:
  push:
    branches:
      - tmp/vpnclient-cleanup-patch

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply temporary VPN cleanup patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact patch and amend commit
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new))

          replace_once(
              'extension/vpnclient/VPNClient.js',
              '''  static getInstance(profileId) {\n    if (instances.hasOwnProperty(profileId))\n      return instances[profileId];\n    else\n      return null;\n  }\n''',
              '''  static getInstance(profileId) {\n    if (instances.hasOwnProperty(profileId))\n      return instances[profileId];\n    else\n      return null;\n  }\n\n  static async isProfileActive(profileId) {\n    const instance = VPNClient.getInstance(profileId);\n    if (instance && instance.isStarted())\n      return true;\n\n    return (await rclient.getAsync(VPNClient.getStateCacheKey(profileId))) === 'true';\n  }\n'''
          )

          replace_once(
              'extension/vpnclient/VPNClient.js',
              '''  static async destroyStoredProfile(profileId) {\n    const configDirectory = path.resolve(this.getConfigDirectory());\n    const files = [".settings", ".json", ".endpoint_routes"];\n\n    for (const suffix of files) {\n      const filePath = path.resolve(configDirectory, `${profileId}${suffix}`);\n      if (filePath !== configDirectory && !filePath.startsWith(`${configDirectory}${path.sep}`)) {\n        log.error(`Refusing to clean VPN client profile outside config directory: ${profileId}`);\n        continue;\n      }\n      await fs.unlinkAsync(filePath).catch(() => { });\n    }\n\n    const primaryProfilePath = this.getPrimaryProfilePath(profileId);\n    if (primaryProfilePath) {\n      const resolvedPath = path.resolve(primaryProfilePath);\n      if (resolvedPath !== configDirectory && !resolvedPath.startsWith(`${configDirectory}${path.sep}`)) {\n        log.error(`Refusing to clean VPN client primary profile outside config directory: ${profileId}`);\n      } else {\n        await fs.unlinkAsync(resolvedPath).catch(() => { });\n      }\n    }\n\n    await rclient.unlinkAsync(VPNClient.getRouteMarkKey(profileId)).catch(() => { });\n    await rclient.delAsync(VPNClient.getStateCacheKey(profileId)).catch(() => { });\n    delete instances[profileId];\n  }\n''',
              '''  static async destroyStoredProfile(profileId) {\n    const configDirectory = path.resolve(this.getConfigDirectory());\n\n    const unlinkStoredFile = async (filePath) => {\n      try {\n        await fs.unlinkAsync(filePath);\n      } catch (err) {\n        if (err && err.code === 'ENOENT')\n          return;\n        throw err;\n      }\n    };\n\n    const files = [".json", ".endpoint_routes"];\n    for (const suffix of files) {\n      const filePath = path.resolve(configDirectory, `${profileId}${suffix}`);\n      if (filePath !== configDirectory && !filePath.startsWith(`${configDirectory}${path.sep}`)) {\n        throw new Error(`Refusing to clean VPN client profile outside config directory: ${profileId}`);\n      }\n      await unlinkStoredFile(filePath);\n    }\n\n    const primaryProfilePath = this.getPrimaryProfilePath(profileId);\n    if (primaryProfilePath) {\n      const resolvedPath = path.resolve(primaryProfilePath);\n      if (resolvedPath !== configDirectory && !resolvedPath.startsWith(`${configDirectory}${path.sep}`)) {\n        throw new Error(`Refusing to clean VPN client primary profile outside config directory: ${profileId}`);\n      }\n      await unlinkStoredFile(resolvedPath);\n    }\n\n    await rclient.unlinkAsync(VPNClient.getRouteMarkKey(profileId)).catch(() => { });\n    await rclient.delAsync(VPNClient.getStateCacheKey(profileId)).catch(() => { });\n    await unlinkStoredFile(path.resolve(configDirectory, `${profileId}.settings`));\n    delete instances[profileId];\n  }\n'''
          )

          replace_once(
              'controllers/netbot.js',
              '''        } catch (err) {\n          if (await c.profileExists(profileId)) {\n            log.warn(`Cleaning up invalid stored VPN client profile ${profileId}`);\n            await pm2.deleteVpnClientRelatedPolicies(profileId);\n''',
              '''        } catch (err) {\n          if (await c.profileExists(profileId)) {\n            if (await VPNClient.isProfileActive(profileId)) {\n              throw { code: 400, msg: `${type} VPN client ${profileId} is still running` };\n            }\n            log.warn(`Cleaning up invalid stored VPN client profile ${profileId}`);\n            await pm2.deleteVpnClientRelatedPolicies(profileId);\n'''
          )

          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'status', '--short'], check=True)
          subprocess.run(['git', 'add', 'extension/vpnclient/VPNClient.js', 'controllers/netbot.js'], check=True)
          subprocess.run(['git', 'rm', '--cached', '--ignore-unmatch', '.github/workflows/.tmp-apply-vpnclient-cleanup.yml'], check=True)
          subprocess.run(['git', 'commit', '--amend', '--no-edit'], check=True)
          subprocess.run(['git', 'push', '--force-with-lease', 'origin', 'HEAD:tmp/vpnclient-cleanup-patch'], check=True)
