name: Temporary VPN cleanup hardening

on:
  push:
    branches:
      - fix/VPNClient-shell-path-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact patch
        run: python3 .github/scripts/.tmp-vpn-cleanup-patch.py

      - name: Verify patch
        run: |
          git diff --check
          git diff -- controllers/netbot.js extension/vpnclient/VPNClient.js

      - name: Commit patch and remove temporary files
        run: |
          rm -f .github/scripts/.tmp-vpn-cleanup-patch.py .github/workflows/.tmp-apply-vpnclient-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add controllers/netbot.js extension/vpnclient/VPNClient.js .github/scripts/.tmp-vpn-cleanup-patch.py .github/workflows/.tmp-apply-vpnclient-hardening.yml
          git commit -m 'fix: harden legacy VPN profile cleanup'
          git push
